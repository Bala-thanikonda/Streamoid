<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Backend Tester (Thymeleaf)</title>
    <style>
        body { font-family:Arial,sans-serif; margin:30px; background:#f4f8fa; color:#222; }
        h1, h2 { color:#1a446d; }
        .section { background:#fff; margin-bottom:30px; padding:20px; border-radius:8px; box-shadow:0 2px 8px #0001; }
        table { width:100%; border-collapse:collapse; margin-top:15px;}
        th, td { padding:8px 12px; border-bottom:1px solid #d0d0d0;}
        th { background:#e6eef5; }
        input[type="text"], input[type="number"] { padding:6px; width:180px; border:1px solid #ccc; border-radius:4px; }
        label { margin-right:10px;}
        input[type="submit"], button { background:#1a446d; color:#fff; border:none; padding:8px 20px; border-radius:5px; margin-top:5px; cursor:pointer;}
        input[type="submit"]:hover, button:hover { background:#3479b7; }
        .response, .error { margin-top:10px;}
        .error { color:#b71c1c;}
    </style>
</head>
<body>
    <h1>Product Backend Tester </h1>
     <button type="button" onclick="window.location.href='/products'">Home</button>

    <div class="section">
       <h2>Upload Products CSV</h2>
        <form th:action="@{/products/upload}" enctype="multipart/form-data" method="post">
             <input type="file" name="file" required accept=".csv" />
             <input type="submit" value="Upload" />
             <button onclick="window.history.back()"> Go Back</button>
        </form>
    <div class="response" th:text="${uploadResponse}"></div>
    </div>


   <div class="section">
     <h2>Search Products</h2>
        <form th:action="@{/products/search}" method="get">
             <label>Brand: <input type="text" name="brand" th:value="${brand}"/></label>
             <label>Color: <input type="text" name="color" th:value="${color}"/></label>
             <label>Min Price: <input type="number" name="minPrice" th:value="${minPrice}"/></label>
             <label>Max Price: <input type="number" name="maxPrice" th:value="${maxPrice}"/></label>
             <input type="submit" value="Search"/>
        </form>
    </div>


     <div class="section">
       <h2>Product List</h2>
         <table>
           <tr>
                <th>SKU</th>
                <th>Name</th>
                <th>Brand</th>
                <th>Color</th>
                <th>Size</th>
                <th>MRP</th>
                <th>Price</th>
                <th>Quantity</th>
                </tr>
                <tr th:each="p : ${products}">
                <td th:text="${p.sku}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.brand}"></td>
                <td th:text="${p.color}"></td>
                <td th:text="${p.size}"></td>
                <td th:text="${p.mrp}"></td>
                <td th:text="${p.price}"></td>
                <td th:text="${p.quantity}"></td>
        </tr>
        </table>
        <div>
            <a th:if="${pageNumber > 0}" th:href="@{/products(page=${pageNumber-1},size=${pageSize},brand=${brand},color=${color},minPrice=${minPrice},maxPrice=${maxPrice})}">Prev</a>
            <span>Page: <span th:text="${pageNumber+1}"></span></span>
            <a th:if="${products.size() == pageSize}" th:href="@{/products(page=${pageNumber+1},size=${pageSize},brand=${brand},color=${color},minPrice=${minPrice},maxPrice=${maxPrice})}">Next</a>
        </div>
    </div>
</body>
</html>
